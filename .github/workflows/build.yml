name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing - generating it with Gradle 8.9"
            mkdir -p /tmp/wrapgen && cd /tmp/wrapgen
            touch settings.gradle
            gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
            cd "$GITHUB_WORKSPACE"
            mkdir -p gradle/wrapper
            cp /tmp/wrapgen/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
            cp /tmp/wrapgen/gradlew /tmp/wrapgen/gradlew.bat .
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CTS-Mapper
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CTS-Mapper.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest CTS-Mapper.apk --title "CTS Mapper" --notes "Commit ${GITHUB_SHA::7}" --prerelease

      - name: Upload wrapper files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: |
            gradle/wrapper/gradle-wrapper.jar
            gradlew
            gradlew.bat
          if-no-files-found: ignore

      - name: Upload build log and reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.log
            app/build/reports/
          if-no-files-found: ignore
